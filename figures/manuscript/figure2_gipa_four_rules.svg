<svg xmlns="http://www.w3.org/2000/svg" width="170mm" height="108mm" viewBox="0 0 481.889764 306.141732" role="img" aria-labelledby="title desc">
<title id="title">GIPA planning, task-level rules and queue-aware variants</title>
<desc id="desc">Slow model-based planning supplies a cached prior. Task-level rules and queue-aware variants include probability refinement, own-queue deadline screening under planned sampling, backlog-priority screening and benefit-threshold ranking. Own-queue information can also enter the operator and ranking. Optional periodic prior refresh is a separate slow stage. Vehicles use no per-task coordination or real-time RSU load report.</desc>
<rect width="100%" height="100%" fill="white"/>
<rect x="8.5039" y="5.6693" width="464.8819" height="56.6929" rx="3.1181" fill="white" stroke="black" stroke-width="0.75"/>
<text x="240.9449" y="22.1102" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10.0" font-weight="700" fill="black">Stage 0   Slow model-based planning</text>
<text x="240.9449" y="38.2677" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="8.6" font-weight="400" fill="black">Anticipated demand and classes, planning latency model and deadlines</text>
<text x="240.9449" y="51.0236" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="8.6" font-weight="400" fill="black">Heuristic prior or planned class probabilities; rule-specific thresholds</text>
<text x="240.9449" y="80.5039" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="9.3" font-weight="700" fill="black">Stage 1   Task-level rules and queue-aware variants</text>
